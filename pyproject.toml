[project]
name = "claude-chat"
version = "1.0.0"
description = "Multi-platform AI desktop GUI / web client for Claude, DeepSeek, and Gemini APIs, built with pywebview."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
dependencies = [
    "pywebview>=5.0",
    "anthropic>=0.103.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "keyring>=24.0.0",
    "httpx>=0.24.0",
    "cryptography>=42.0.0",
]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F) and pycodestyle (E, W) codes by default
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
