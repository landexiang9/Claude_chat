[project]
name = "claude-chat"
version = "1.0.0"
description = "Multi-platform AI desktop GUI / web client for Claude, DeepSeek, and Gemini APIs, built with pywebview."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
dependencies = [
    "pywebview>=5.0",
    "anthropic>=1.2.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "keyring>=24.0.0",
    "httpx>=0.24.0",
    "httpx2>=2.0.0,<3",
    "cryptography>=42.0.0",
    # Attachment parsing (keep in sync with requirements.txt)
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pypdf>=4.0.0",
]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F) and pycodestyle (E, W) codes by default
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
